    <script>
        (function () {
            var GDPS_HOST = "https://dimgdps.ps.fhgdps.com";
            var WORKER_HOST = "https://gdps-proxy.marvelous-peak.workers.dev";
            var PROXY_CORS = "https://proxy.corsfix.com/?";
            var IS_LOCAL = (location.hostname === "localhost" || location.hostname === "127.0.0.1");
            window._gdProxyUrl = IS_LOCAL ? GDPS_HOST : WORKER_HOST;
            var nativeFetch = window.fetch.bind(window);
            // the GDPS requires gameVersion/binaryVersion on .php POST endpoints
            var GD_CLIENT_PARAMS = "gameVersion=22&binaryVersion=42";
            function withClientParams(url, init) {
                if (url.indexOf(".php") === -1 && url.indexOf(WORKER_HOST) !== 0) return init;
                var method = (init && init.method) || "GET";
                if (String(method).toUpperCase() !== "POST") return init;
                if (!init || typeof init.body !== "string") return init;
                if (init.body.indexOf("gameVersion=") !== -1) return init;
                var copy = {};
                for (var key in init) {
                    if (Object.prototype.hasOwnProperty.call(init, key)) copy[key] = init[key];
                }
                copy.body = init.body + (init.body.length ? "&" : "") + GD_CLIENT_PARAMS;
                return copy;
            }
            function onFail(url, init) { return function () { return nativeFetch(url, init); }; }
            // route .php/worker requests through the local proxy (localhost) only
            window.fetch = function (input, init) {
                var isRequestObj = (typeof Request !== "undefined") && (input instanceof Request);
                var url = isRequestObj ? input.url : input;
                if (typeof url !== "string") {
                    return nativeFetch(input, init);
                }
                init = withClientParams(url, init);
                if (url.indexOf(GDPS_HOST) === 0 || url.indexOf(PROXY_CORS) === 0) {
                    if (IS_LOCAL) {
                        return nativeFetch("/gd" + url.slice(GDPS_HOST.length), init).catch(onFail(url, init));
                    }
                    return nativeFetch(PROXY_CORS + url, init).catch(onFail(url, init));
                }
                return nativeFetch(input, init);
            };
        })();
    </script>
