    <script>
        (function () {
            var GD_PROXY_HOSTS = [
                "https://dimgdps.ps.fhgdps.com"
            ];
            window._gdProxyUrl = GD_PROXY_HOSTS[0];
            window._gdProxyHosts = GD_PROXY_HOSTS;
            var nativeFetch = window.fetch.bind(window);
            function matchingHost(url) {
                for (var i = 0; i < GD_PROXY_HOSTS.length; i++) {
                    if (url.indexOf(GD_PROXY_HOSTS[i]) === 0) return GD_PROXY_HOSTS[i];
                }
                return null;
            }
            // the GDPS requires gameVersion/binaryVersion on .php POST endpoints
            var GD_CLIENT_PARAMS = "gameVersion=22&binaryVersion=42";
            function withClientParams(url, init) {
                if (url.indexOf(".php") === -1) return init;
                var method = (init && init.method) || "GET";
                if (String(method).toUpperCase() !== "POST") return init;
                if (!init || typeof init.body !== "string") return init;
                if (init.body.indexOf("gameVersion=") !== -1) return init;
                var copy = {};
                for (var key in init) {
                    if (Object.prototype.hasOwnProperty.call(init, key)) copy[key] = init[key];
                }
                copy.body = init.body + (init.body.length ? "&" : "") + GD_CLIENT_PARAMS;
                return copy;
            }
            // rewrite GDPS URLs to the local server proxy (/gd/...) so no CORS issues
            window.fetch = function (input, init) {
                var isRequestObj = (typeof Request !== "undefined") && (input instanceof Request);
                var url = isRequestObj ? input.url : input;
                if (typeof url !== "string") {
                    return nativeFetch(input, init);
                }
                init = withClientParams(url, init);
                var oldHost = matchingHost(url);
                if (!oldHost) {
                    return nativeFetch(input, init);
                }
                var canUseLocal = location.protocol === "http:" || location.protocol === "https:";
                var localUrl = "/gd" + url.slice(oldHost.length);
                function toRequest(u) {
                    return isRequestObj ? new Request(u, input) : u;
                }
                if (canUseLocal) {
                    return nativeFetch(toRequest(localUrl), init).then(function (res) {
                        if (res.status === 429 || res.status === 503) {
                            return nativeFetch(toRequest(url), init);
                        }
                        return res;
                    }, function () {
                        return nativeFetch(toRequest(url), init);
                    });
                }
                return nativeFetch(toRequest(url), init);
            };
        })();
    </script>
